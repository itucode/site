{{- if .Site.Params.sidebar.widgets -}}
<aside class="sidebar {{ if eq .Site.Params.sidebar.position "left" }}sidebar--left{{ else }}sidebar--right{{ end }}">
    {{- $root := . }}
    {{- range .Site.Params.sidebar.widgets }}
        {{- $widgetPath := printf "widgets/%s.html" . }}
        {{- partial $widgetPath $root }}
    {{- end }}
</aside>
{{- end }}
